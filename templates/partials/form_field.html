<div class="form-group">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span>{% endif %}</label>
  <div class="input-wrap">{% if icon %}{% include 'partials/icon.html' with icon=icon %}{% endif %}{{ field }}</div>
  {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error" role="alert">{% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div>{% endif %}
</div>
